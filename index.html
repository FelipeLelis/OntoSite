<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando - AirData Ontology</title>
    <meta http-equiv="refresh" content="0; url=https://airdata-ita.github.io/ita-airdata-owl/">
    <link rel="canonical" href="https://airdata-ita.github.io/ita-airdata-owl/">
    <script>
        (function () {
            var target = "https://airdata-ita.github.io/ita-airdata-owl/";
            window.location.replace(target);
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, rgba(0, 60, 125, 0.08), transparent 30%),
                linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
            color: #1f2937;
        }
        .redirect-card {
            width: min(560px, 100%);
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(209, 217, 224, 0.95);
            border-radius: 18px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        }
        .badge {
            display: inline-block;
            margin-bottom: 14px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(0, 60, 125, 0.08);
            color: #003c7d;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 30px;
            line-height: 1.15;
            color: #0f172a;
        }
        p {
            margin: 0;
            color: #475569;
            line-height: 1.7;
            font-size: 16px;
        }
        a {
            color: #003c7d;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="redirect-card">
        <div class="badge">AirData Ontology</div>
        <h1>Redirecionando para o site atual</h1>
        <p>
            O site antigo foi substituido pela documentacao atual.
            Se o redirecionamento nao acontecer automaticamente,
            <a href="https://airdata-ita.github.io/ita-airdata-owl/">clique aqui</a>.
        </p>
    </main>
</body>
</html>
